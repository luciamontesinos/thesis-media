<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Picnic Scene</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hint {
      position: fixed; left: 12px; bottom: 12px; color: #ccc; background: rgba(0,0,0,0.45);
      padding: 10px 14px; border-radius: 8px; font-size: 12px; line-height: 1.6; max-width: 320px;
      pointer-events: none; user-select: none;
    }
    #hint b { color: #fff; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #999; font-size: 14px; letter-spacing: 0.05em; z-index: 10;
    }
    #resetBtn {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      background: rgba(20,20,22,0.75); color: #eee; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; padding: 8px 14px; font-size: 12px; font-family: inherit;
      cursor: pointer;
    }
    #resetBtn:hover { background: rgba(40,40,44,0.85); }
  </style>
</head>
<body>
  <div id="loading">Loading picnic scene…</div>
  <button id="resetBtn" hidden>Reset layout</button>
  <div id="hint">
    <b>Camera</b> — left-drag: orbit · right-drag: pan · wheel: zoom<br/>
    <b>Play</b> — click to hold an object <br/>
     drag and let go to throw it.
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
