<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Codes — Supplementary Material</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #ffffff;
      --text:       #1a1a1a;
      --accent:     #FF0000;
      --subtle:     #666;
      --border:     #e0e0e0;
      --hover-bg:   #1a1a1a;
      --hover-text: #ffffff;
    }
    [data-theme="dark"] {
      --bg:         #0d0d0d;
      --text:       #ebebeb;
      --accent:     #FF0000;
      --subtle:     #999;
      --border:     #2a2a2a;
      --hover-bg:   #ebebeb;
      --hover-text: #0d0d0d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Newsreader', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, color 0.2s;
    }

    .site-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .site-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--subtle);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links a {
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--subtle);
      text-decoration: none;
      letter-spacing: 0.06em;
    }

    .nav-links a:hover { color: var(--text); }

    main {
      padding: 2.5rem 2rem 5rem;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .instructions {
      font-size: 0.88rem;
      color: var(--subtle);
      font-style: italic;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 2rem;
    }

    .card {
      border: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
    }

    .card img {
      display: block;
      width: 160px;
      height: 160px;
    }

    .card .label {
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--accent);
      text-align: center;
      letter-spacing: 0.06em;
    }

    .card .title {
      font-size: 0.8rem;
      color: var(--subtle);
      text-align: center;
      font-style: italic;
      line-height: 1.4;
    }

    .card .url-text {
      font-size: 0.6rem;
      color: var(--border);
      word-break: break-all;
      text-align: center;
      font-family: 'Outfit', monospace;
    }



    @media print {
      body { background: #fff; }
      .site-nav, .instructions, #theme-toggle { display: none; }
      main { padding: 1rem; }
      #grid { gap: 1.5rem; }
      .card { break-inside: avoid; border: 1px solid #ccc; }
    }
  </style>
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
<link rel="stylesheet" href="site.css">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="site-name">Supplementary Material</a>
    <div class="nav-links">
      <a href="index.html">About</a>
      <a href="figures.html">Figures</a>
      <button id="theme-toggle" onclick="toggleTheme()"></button>
    </div>
  </nav>

  <main>
    <h1>QR Codes</h1>
    <p class="instructions">
      Cmd+P / Ctrl+P to print, or right-click any image to save it.<br>
      Generate these only after the site is deployed — the codes encode the live URL.
    </p>
    <div id="grid"></div>
  </main>


  <script src="media.js"></script>
  <script>
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateToggleLabel();
    }

    function updateToggleLabel() {
      var t = document.documentElement.getAttribute('data-theme');
      document.getElementById('theme-toggle').textContent = t === 'dark' ? 'Light' : 'Dark';
    }

    var base = window.location.href.replace(/qr\.html.*$/, 'figure.html');
    var grid = document.getElementById('grid');

    MEDIA.forEach(function(item, index) {
      var url = base + '#' + item.id;

      var card = document.createElement('div');
      card.className = 'card';

      var img = document.createElement('img');
      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=6&data=' + encodeURIComponent(url);
      img.alt = 'Figure ' + (index + 1);
      card.appendChild(img);

      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = 'Figure ' + (index + 1);
      card.appendChild(label);

      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = item.title;
      card.appendChild(title);

      var urlText = document.createElement('div');
      urlText.className = 'url-text';
      urlText.textContent = url;
      card.appendChild(urlText);

      grid.appendChild(card);
    });

    updateToggleLabel();
  </script>
</body>
</html>
